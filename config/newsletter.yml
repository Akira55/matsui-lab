# 研究活動 差分生成の設定
#
# base_date を指定すると、常にその日付から end_date までを対象にします。
# 通常運用では base_date は空(null)にし、cycle_anchor_day で月次サイクルを管理します。
#
# 基準日(対象期間の開始日)の決定優先順位:
#   1. コマンドライン引数 --base-date
#   2. この設定ファイルの base_date
#   3. コマンドライン引数 --cycle-anchor-day から計算
#   4. この設定ファイルの cycle_anchor_day から計算

# 固定の基準日。通常は null。例: "2026-04-01"
base_date: null

# 月次サイクルの基準日(1-31)。end_date 以前で最も近いこの日を基準日とします。
# 例: 25 のとき、end_date が 6/25 なら基準日は 6/25、6/24 なら基準日は 5/25。
# 月にその日が無い場合(31 と 2月 など)は、その月の末日に丸めます。
cycle_anchor_day: 25

# 日付計算に使うタイムゾーン。
timezone: "Asia/Tokyo"

# 事務(共同研究推進室)に共有する raw URL。JSON 内にそのまま埋め込まれます。
raw_text_url: "https://raw.githubusercontent.com/Akira55/matsui-lab/main/newsletter/latest.txt"
raw_json_url: "https://raw.githubusercontent.com/Akira55/matsui-lab/main/newsletter/latest.json"

# カテゴリの表示順。ここに無いカテゴリは末尾に unknown_category_label でまとめます。
category_order:
  - 論文掲載
  - 国際会議発表
  - 国内研究発表
  - 招待講演
  - 学術貢献活動
  - 社会活動
  - メディア掲載

# category_order に無いカテゴリの見出し。
unknown_category_label: "その他"
