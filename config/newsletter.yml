# 研究活動 月次ニュースレターの設定
#
# データは researchmap 同期 → scripts/build-activities.mjs が生成する
# data/activities.yml が正本。手動補足は data/activities.manual.yml。
# scripts/build_newsletter.py が月ごとのファイルを出力します。

# 生成を開始する月 (YYYY-MM)。これより前の月のファイルは作りません。
# 例: "2026-04" にすると 2026年4月号から生成します。
start_month: "2026-04"

# raw 配信のベース URL。各月ファイルへの URL がこの下に作られます。
#   <raw_base_url>/txt/<YYYY-MM>.txt
#   <raw_base_url>/json/<YYYY-MM>.json
raw_base_url: "https://raw.githubusercontent.com/Akira55/matsui-lab/main/newsletter"

# カテゴリの表示順。ここに無いカテゴリは末尾に unknown_category_label でまとめます。
category_order:
  - 論文掲載
  - 国際会議発表
  - 国内研究発表
  - 招待講演
  - 学術貢献活動
  - 社会活動
  - メディア掲載

# category_order に無いカテゴリの見出し。
unknown_category_label: "その他"
