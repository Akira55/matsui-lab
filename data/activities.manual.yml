# 手動補足ファイル(任意)。
# =====================================================================
# data/activities.yml は researchmap から自動生成され、同期のたびに上書き
# されます。このファイルはそれに「上乗せ」する手動データで、上書きされません。
#
# 用途:
#   1. researchmap に載らない活動を追加する(メディア出演・社会活動など)。
#   2. 自動判定されたカテゴリ等を修正する。
#      → 直したい自動項目と同じ url を書き、変えたいフィールドだけ書けば、
#        その項目に上書きマージされます(url が無い項目は title + date で照合)。
#
# 各項目のフィールド:
#   title    (必須)
#   category (必須) 論文掲載 / 国際会議発表 / 国内研究発表 / 招待講演 /
#                   学術貢献活動 / 社会活動 / メディア掲載  から選ぶ
#   date     (必須) "YYYY-MM-DD" または "YYYY-MM"
#   venue / location / details / role / url (任意)
# =====================================================================

activities: []
