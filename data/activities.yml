# 松井暉 研究活動の記録(差分生成の唯一の入力)
# =====================================================================
# 新しい活動を追加するには、activities: の下に "- title:" から始まる項目を
# 追記するだけです(順番は問いません。スクリプトが日付で並べ替えます)。
#
# 各項目のフィールド:
#   title    (必須) 活動名・発表タイトルなど
#   category (必須) 下記の候補から選ぶ
#   date     (必須) "YYYY-MM-DD" 形式。必ずダブルクオートで囲む
#   venue    (任意) 学会名・会議名・掲載媒体など
#   location (任意) 開催地。テキストでは「於：」として表示
#   details  (任意) 補足(口頭発表 / ポスター発表 など)
#   role     (任意) 自身の役割(セッションチェア / 企画立案 など)
#   url      (任意) 関連 URL
#
# category の候補(config/newsletter.yml の category_order と対応):
#   - 論文掲載
#   - 国際会議発表
#   - 国内研究発表
#   - 招待講演
#   - 学術貢献活動
#   - 社会活動
#   - メディア掲載
# 上記以外を書いた場合は、出力時に末尾の「その他」へまとめられます。
# =====================================================================

